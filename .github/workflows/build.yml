name: Build & release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.50.1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --concurrency=1

  # Built on the oldest supported Ubuntu so the binary's glibc requirement stays low
  # (runs on Ubuntu 22.04+, Debian 12+, Fedora 36+).
  linux:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev rpm
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Version
        run: echo "VERSION=$(./packaging/version.sh)" >> "$GITHUB_ENV"
      - run: flutter build linux --release --build-name="$VERSION"
      - name: Build .deb, .rpm and tarball
        run: packaging/linux/build-packages.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Version
        shell: bash
        run: echo "VERSION=$(./packaging/version.sh)" >> "$GITHUB_ENV"
      - run: flutter build windows --release --build-name="$env:VERSION"
      - name: Bundle Visual C++ runtime
        # Lets the app start on PCs without the VC++ Redistributable (these DLLs are redistributable).
        shell: pwsh
        run: |
          foreach ($dll in 'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" build\windows\x64\runner\Release\
          }
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$env:VERSION" packaging\windows\courier.iss
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\courier-windows-x64-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Version
        run: echo "VERSION=$(./packaging/version.sh)" >> "$GITHUB_ENV"
      # Release builds are universal (arm64 + x86_64): one app for Apple Silicon and Intel.
      - run: flutter build macos --release --build-name="$VERSION"
      - name: Verify universal binary and package
        run: |
          lipo -info build/macos/Build/Products/Release/Courier.app/Contents/MacOS/Courier
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/Courier.app dist/courier-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes from CHANGELOG.md
        # Takes the "## [x.y.z]" section matching the tag; fails if it is missing so a release is never published without notes.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="## [$VERSION]" 'index($0, v) == 1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section"; exit 1
          fi
          cat release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release-notes.md
          generate_release_notes: true

  # apt + dnf repositories on GitHub Pages (gh-pages branch).
  # One-time setup: add secret LINUX_REPO_GPG_KEY (see README → Releasing), then
  # Settings → Pages → Deploy from branch → gh-pages / (root).
  linux-repos:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_KEY: ${{ secrets.LINUX_REPO_GPG_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
      - uses: actions/download-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: linux
          path: pkgs
      - name: Publish signed apt and dnf repositories
        if: env.HAS_KEY == 'true'
        env:
          GPG_KEY: ${{ secrets.LINUX_REPO_GPG_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update && sudo apt-get install -y apt-utils createrepo-c rpm
          echo "$GPG_KEY" | gpg --batch --import
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          rm -f pkgs/*.tar.gz
          git clone --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site \
            || (mkdir site && git -C site init -b gh-pages && git -C site remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git")
          BASE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          packaging/linux/publish-repos.sh pkgs site "$KEY_ID" "$BASE"
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish ${GITHUB_REF_NAME}"
          git push origin gh-pages
      - name: Skipped
        if: env.HAS_KEY != 'true'
        run: echo "LINUX_REPO_GPG_KEY secret not set; apt/dnf repositories were not published."

  # Homebrew cask in https://github.com/<owner>/homebrew-tap.
  # One-time setup: create that repo and add secret HOMEBREW_TAP_TOKEN (see README → Releasing).
  homebrew:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
      - uses: actions/download-artifact@v4
        if: env.HAS_TOKEN == 'true'
        with:
          name: macos
          path: mac
      - name: Update cask
        if: env.HAS_TOKEN == 'true'
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(sha256sum mac/courier-macos-universal.zip | cut -d' ' -f1)
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-tap.git" tap
          mkdir -p tap/Casks
          sed -e "s/@VERSION@/$VERSION/" -e "s/@SHA256@/$SHA/" packaging/homebrew/courier.rb.in > tap/Casks/courier.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/courier.rb
          git commit -m "courier ${VERSION}"
          git push
      - name: Skipped
        if: env.HAS_TOKEN != 'true'
        run: echo "HOMEBREW_TAP_TOKEN secret not set; Homebrew cask was not updated."
