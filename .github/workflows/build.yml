name: Build desktop apps

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --concurrency=1

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
      - run: flutter build linux --release
      - run: tar -C build/linux/x64/release/bundle -czf courier-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: courier-linux-x64
          path: courier-linux-x64.tar.gz

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
      - run: flutter build windows --release
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath courier-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: courier-windows-x64
          path: courier-windows-x64.zip

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
      # Flutter release builds for macOS are universal binaries (arm64 + x86_64),
      # so the same .app runs natively on Apple Silicon and Intel Macs.
      - run: flutter build macos --release
      - name: Verify universal binary and package
        run: |
          lipo -info build/macos/Build/Products/Release/Courier.app/Contents/MacOS/Courier
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/Courier.app courier-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: courier-macos-universal
          path: courier-macos-universal.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
